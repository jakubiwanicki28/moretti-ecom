<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="400" viewBox="0 0 1920 400" role="img" aria-label="Okazje na Dzien Kobiet">
  <defs>
    <linearGradient id="bgMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9c0018"/>
      <stop offset="52%" stop-color="#b0041f"/>
      <stop offset="100%" stop-color="#7f0013"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.18" cy="0.36" r="0.6">
      <stop offset="0%" stop-color="rgba(255,170,186,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,170,186,0)"/>
    </radialGradient>
    <linearGradient id="ctaFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f2f3"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="400" fill="url(#bgMain)"/>
  <rect width="1920" height="400" fill="url(#glowLeft)"/>

  <g opacity="0.22">
    <rect x="980" y="-30" width="130" height="460" fill="#b40e26"/>
    <rect x="1110" y="-30" width="90" height="460" fill="#ad0a21"/>
    <rect x="1200" y="-30" width="120" height="460" fill="#b80f27"/>
    <rect x="1320" y="-30" width="100" height="460" fill="#9f061d"/>
    <rect x="1420" y="-30" width="140" height="460" fill="#b50c24"/>
    <rect x="1560" y="-30" width="120" height="460" fill="#95041a"/>
  </g>

  <g>
    <text x="120" y="122" fill="#ffd7df" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="2">LIMITED DROP</text>
    <text x="120" y="188" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">Okazje na Dzien Kobiet</text>
    <text x="120" y="238" fill="#ffe9ed" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500">-30% na wybrane modele portfeli</text>
    <text x="120" y="280" fill="#ffd4dc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Oferta limitowana czasowo. Wybierz styl, ktory zostaje z Toba na lata.</text>
  </g>

  <g>
    <rect x="120" y="306" width="250" height="62" rx="2" fill="url(#ctaFill)"/>
    <text x="182" y="348" fill="#8f0017" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">Zobacz kolekcje</text>
  </g>
</svg>
