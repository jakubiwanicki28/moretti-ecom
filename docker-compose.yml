# Lokalna kopia sklepu Moretti (OrbStack / Docker).
# Wersje są przypięte do produkcji — przy aktualizacji produkcji zaktualizuj je tutaj
# i w scripts/local-env/setup.sh.
#
#   docker compose up -d && scripts/local-env/setup.sh
#   → http://localhost:8080  (admin / admin)
#
# Motyw to katalog główny repo (na produkcji: wp-content/themes/moretti-ecom, wdrażany WP Pusherem).

services:
  db:
    image: mariadb:11.4
    container_name: moretti-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: moretti
      MARIADB_USER: moretti
      MARIADB_PASSWORD: moretti
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.9.4-php8.3-apache
    container_name: moretti-wordpress
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: moretti
      WORDPRESS_DB_PASSWORD: moretti
      WORDPRESS_DB_NAME: moretti
      WORDPRESS_DEBUG: 1
      # wp-config.php czyta to przy każdym żądaniu, więc kontener cli też musi to mieć.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/moretti-ecom
      - ./scripts/local-env/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  cli:
    image: wordpress:cli-php8.3
    container_name: moretti-cli
    user: "33:33"
    depends_on:
      - db
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/moretti-ecom
      - ./scripts/local-env/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./scripts/local-env:/local-env:ro
    entrypoint: ["tail", "-f", "/dev/null"]

  # Kompilacja Tailwinda: docker compose run --rm node npm run build
  node:
    image: node:18
    working_dir: /app
    volumes:
      - ./:/app
    profiles: ["tools"]

volumes:
  db_data:
  wp_data:
